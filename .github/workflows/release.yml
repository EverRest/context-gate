name: Release

# Dry run by default: the guards run, the archive is built and uploaded, and no release is created.
# A GitHub release is created only when `publish` is ticked. Packagist picks up tags on its own.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string
      publish:
        description: 'Create the GitHub release (leave unticked for a dry run)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The release is gated by the same tests as every push.
  ci:
    uses: ./.github/workflows/ci.yml

  # Read-only: runs the guards, builds the archive and uploads it. Nothing is published here.
  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release guards
        run: scripts/check-release.sh

      - name: Build archive
        run: git archive --format=tar.gz --prefix="context-gate-${TAG}/" --output="context-gate-${TAG}.tar.gz" HEAD

      # Pinned to the SHA ci.yml already uses (v7.0.2).
      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-gate-${{ inputs.tag }}
          path: context-gate-${{ inputs.tag }}.tar.gz
          if-no-files-found: error

  # The only job with write access. It runs only when `publish` is ticked, and only downloads the archive built above.
  publish:
    needs: build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # Pinned to the major tag: download-artifact's SHA is not in the repo yet. Pin it like ci.yml once verified.
      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: context-gate-${{ inputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "context-gate-${TAG}.tar.gz" --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
