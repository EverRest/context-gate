name: CI

on:
  push:
    branches: ['**']   # tags are gated by release.yml, which calls this workflow
  pull_request:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'   # nightly: the concurrency job repeats its budget tests 100 times (spec 008 SC-001)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'   # the nightly run is the concurrency job only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [locked]   # the main matrix runs on composer.lock
        include:
          # Consumers ignore our lock: also test the oldest and the newest versions composer.json admits.
          - { php: '8.2', deps: lowest }
          - { php: '8.5', deps: highest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, redis
          coverage: none
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.lock') }}
      - run: composer validate --strict
        if: matrix.php == '8.3' && matrix.deps == 'locked'
      - run: composer install --no-interaction --prefer-dist
        if: matrix.deps == 'locked'
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
        if: matrix.deps == 'lowest'
      # config.platform.php pins resolution to 8.2.0 for the lock; the highest leg must resolve for the runner's PHP,
      # or it never reaches Laravel 13, which needs PHP 8.3.
      - run: |
          composer config platform.php --unset
          composer update --prefer-stable --no-interaction --prefer-dist
        if: matrix.deps == 'highest'
      - run: composer show laravel/framework | grep -E '^versions\s*:\s*\* v13\.'
        if: matrix.deps == 'highest'
      - run: composer audit --locked
        if: matrix.php == '8.3' && matrix.deps == 'locked'
      # Runtime requirements must be advisory-free at their floor; dev tools at their floor may not be.
      - run: composer audit --no-dev
        if: matrix.deps != 'locked'
      - run: composer test
      - run: composer stan
        if: (matrix.php == '8.3' && matrix.deps == 'locked') || matrix.deps == 'highest'   # highest resolves Guzzle 8
      - run: composer style
        if: (matrix.php == '8.3' && matrix.deps == 'locked') || matrix.deps == 'highest'   # highest resolves Guzzle 8
      # The file-length and spec-reference checks run once, on the locked PHP 8.3 leg (spec 011 R7).
      - run: composer length
        if: matrix.php == '8.3' && matrix.deps == 'locked'
      - run: composer refs
        if: matrix.php == '8.3' && matrix.deps == 'locked'

  # Mutation testing over the security scope (spec 011 US1). Fails below minMsi in infection.json5; runs on every
  # push and pull request, whatever the change touched. pcov is the coverage driver Infection needs.
  mutation:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Non-blocking until the baseline mutation score is measured (spec 011 decision, 2026-11-02).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite
          coverage: pcov
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-8.3-locked-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer mutation

  # Line coverage of src/ against the floor in scripts/coverage-floor.php (spec 011 US2). The job summary gets the
  # measured value.
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite
          coverage: pcov
      - id: cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: composer-8.3-locked-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: composer coverage

  # Opt-in multi-process tests (spec 008 US2, FR-003/FR-004): the file store, then a Redis service with noeviction.
  # Each Laravel major resolves its own Testbench. Not part of composer test, which stays offline.
  concurrency-redis:
    # Non-blocking on the nightly 100-repeat run until BudgetProcessTest passes it (spec 008 Amendments).
    continue-on-error: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One Laravel major: the test job's 8.5 highest leg runs Laravel 13 and asserts it. Spec 008 Amendments, 2026-11-02.
          - { laravel: '12', testbench: '10', php: '8.3' }
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
        # noeviction: an evicted counter would widen a limit (spec 008 FR-012)
    env:
      CONTEXT_GATE_CONCURRENCY: '1'
      CONTEXT_GATE_CONCURRENCY_REQUIRED: '1'   # a skipped run must fail this job, not pass it
      REDIS_HOST: '127.0.0.1'
      REDIS_PORT: '6379'
      CONTEXT_GATE_REPEAT: ${{ github.event_name == 'schedule' && '100' || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, redis
          coverage: none
      - run: composer update --with-all-dependencies --no-interaction --prefer-dist "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"
      # The runner has no redis-cli: the policy is set and read back with the phpredis client the job installs.
      - name: Redis server policy
        run: |
          php -r '$r = new Redis(); $r->connect("127.0.0.1", 6379); $r->config("SET", "maxmemory-policy", "noeviction"); if ($r->config("GET", "maxmemory-policy")["maxmemory-policy"] !== "noeviction") { exit(1); }'
      - run: vendor/bin/phpunit --testsuite Concurrency
      - run: CONTEXT_GATE_STORE=redis vendor/bin/phpunit --testsuite Concurrency

  # Fresh skeletons on each supported Laravel major: install, gate:check and the quickstart (spec 006, US4).
  install-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite
          coverage: none
      - run: bash scripts/install-test.sh ${{ matrix.laravel }}
